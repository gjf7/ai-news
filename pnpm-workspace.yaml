packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@fastify/static": ^8.3.0
  "@types/node": ^24
  fast-xml-parser: ^5.11.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Native/build-script dependencies that are allowed to compile.
allowBuilds:
  better-sqlite3: true
  esbuild: true
